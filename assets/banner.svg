<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1854" height="520" viewBox="0 0 1854 520" role="img" aria-label="Pi-function">
  <title>Pi-function</title>
  <style>
    /* 波浪：只起伏与变暗，不出现/消失 */
    @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    @keyframes dim { 0%, 100% { opacity: 1 } 50% { opacity: 0.55 } }
    .wave { animation: bob 2.6s ease-in-out infinite, dim 2.6s ease-in-out infinite }
    .dot { animation: breathe 2.6s ease-in-out infinite }
    @keyframes breathe { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) {
      .wave, .dot { animation: none }
    }
  </style>
  <rect width="1854" height="520" rx="36" fill="#0B0E14"/>
  <rect x="1" y="1" width="1852" height="518" rx="35" fill="none" stroke="#1E2634" stroke-width="2"/>

  <!-- Pi mark: official logo, unchanged -->
  <g transform="translate(96,80) scale(0.45)">
    <path fill="#F09082" d="M165.29 165.29L517.36 165.29L517.36 400L400 400L400 282.65L165.29 282.65Z"/>
    <path fill="#4D9ABF" d="M165.29 282.65L282.65 282.65L282.65 400L400 400L400 517.36L282.65 517.36L282.65 634.72L165.29 634.72Z"/>
    <path fill="#F1BE58" d="M517.36 400L634.72 400L634.72 634.72L517.36 634.72Z"/>
  </g>

  <!-- function: 5x7 pixel wordmark; every letter-to-letter gap is 1 cell (26px) -->
  <g fill="#FFFFFF" shape-rendering="crispEdges">
