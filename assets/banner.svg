      <rect x="926" y="246" width="26" height="26" data-letter="2"/>
      <rect x="822" y="272" width="26" height="26" data-letter="2"/>
      <rect x="926" y="272" width="26" height="26" data-letter="2"/>
      <rect x="822" y="298" width="26" height="26" data-letter="2"/>
      <rect x="926" y="298" width="26" height="26" data-letter="2"/>
      <rect x="822" y="324" width="26" height="26" data-letter="2"/>
