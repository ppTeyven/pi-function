<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1854" height="520" viewBox="0 0 1854 520" role="img" aria-label="Pi-function">
  <title>Pi-function</title>
  <style>
    /* 打字式入场：整块出现（steps），没有任何半透明覆盖 */
    @keyframes type { from { opacity: 0 } to { opacity: 1 } }
    @keyframes caretOn { 0%, 49.9% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes off { to { opacity: 0 } }
    @keyframes breathe { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
    .px { opacity: 0; animation: type 1ms steps(1) forwards }
    .caret { opacity: 0; animation: caretOn 420ms steps(1) infinite, off 1ms steps(1) forwards }
    .dot { animation: breathe 3200ms ease-in-out infinite }
    @media (prefers-reduced-motion: reduce) {
      .px { animation: none; opacity: 1 }
      .caret { display: none }
      .dot { animation: none }
    }
  </style>
  <rect width="1854" height="520" rx="36" fill="#0B0E14"/>
  <rect x="1" y="1" width="1852" height="518" rx="35" fill="none" stroke="#1E2634" stroke-width="2"/>

  <!-- Pi mark: official logo, unchanged -->
  <g transform="translate(96,80) scale(0.45)">
    <path fill="#F09082" d="M165.29 165.29L517.36 165.29L517.36 400L400 400L400 282.65L165.29 282.65Z" class="px" style="animation-delay:0ms"/>
    <path fill="#4D9ABF" d="M165.29 282.65L282.65 282.65L282.65 400L400 400L400 517.36L282.65 517.36L282.65 634.72L165.29 634.72Z" class="px" style="animation-delay:160ms"/>
    <path fill="#F1BE58" d="M517.36 400L634.72 400L634.72 634.72L517.36 634.72Z" class="px" style="animation-delay:320ms"/>
  </g>

