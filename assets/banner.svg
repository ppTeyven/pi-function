<rect x="588" y="168" width="52" height="26" data-letter="0"/>
      <rect x="588" y="194" width="26" height="26" data-letter="0"/>
      <rect x="536" y="220" width="104" height="26" data-letter="0"/>
      <rect x="588" y="246" width="26" height="26" data-letter="0"/>
      <rect x="588" y="272" width="26" height="26" data-letter="0"/>
      <rect x="588" y="298" width="26" height="26" data-letter="0"/>
      <rect x="588" y="324" width="26" height="26" data-letter="0"/>
    </g>
    <g class="wave" style="animation-delay:-0.257s">
<rect x="666" y="220" width="26" height="26" data-letter="1"/>
