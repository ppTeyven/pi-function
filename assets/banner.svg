  <title>Pi-function</title>
  <style>
    /* 入场：从下往上逐列浮现；被剥离时这些属性等于没有，字仍然完整可见 */
    @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
    @keyframes breathe { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
    .px { animation: rise 0.42s cubic-bezier(.22,.61,.36,1) both }
    .dot { animation: breathe 3.2s ease-in-out infinite }
    @media (prefers-reduced-motion: reduce) {
      .px, .dot { animation: none }
    }
  </style>
  <rect width="1854" height="520" rx="36" fill="#0B0E14"/>
  <rect x="1" y="1" width="1852" height="518" rx="35" fill="none" stroke="#1E2634" stroke-width="2"/>

  <!-- Pi mark: official logo, unchanged -->
