  <!-- typing caret -->
  <g shape-rendering="crispEdges">
    <rect class="caret" x="692" y="220" width="18" height="78" fill="#FFFFFF" style="animation-delay:300ms,400ms"/>
    <rect class="caret" x="874" y="220" width="18" height="78" fill="#FFFFFF" style="animation-delay:400ms,500ms"/>
