    <g class="wave" style="animation-delay:-1.026s">
<rect x="1160" y="168" width="26" height="26" data-letter="4"/>
      <rect x="1160" y="194" width="26" height="26" data-letter="4"/>
      <rect x="1108" y="220" width="104" height="26" data-letter="4"/>
