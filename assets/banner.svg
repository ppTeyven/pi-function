  <!-- three pixels from the Pi palette -->
  <g shape-rendering="crispEdges">
    <rect x="1704" y="474" width="16" height="16" fill="#F09082" class="dot" style="animation-delay:-0.00s"/>
    <rect x="1728" y="474" width="16" height="16" fill="#4D9ABF" class="dot" style="animation-delay:-0.20s"/>
    <rect x="1752" y="474" width="16" height="16" fill="#F1BE58" class="dot" style="animation-delay:-0.40s"/>
  </g>
