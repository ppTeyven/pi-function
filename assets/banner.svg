      <rect x="1238" y="298" width="26" height="26" data-letter="5"/>
      <rect x="1238" y="324" width="26" height="26" data-letter="5"/>
    </g>
    <g class="wave" style="animation-delay:-1.539s">
<rect x="1316" y="220" width="78" height="26" data-letter="6"/>
      <rect x="1290" y="246" width="26" height="26" data-letter="6"/>
      <rect x="1394" y="246" width="26" height="26" data-letter="6"/>
      <rect x="1290" y="272" width="26" height="26" data-letter="6"/>
      <rect x="1394" y="272" width="26" height="26" data-letter="6"/>
